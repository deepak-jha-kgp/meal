<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#211623">
  <title>Meal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--night:#211623;--night2:#2c1d2f;--night3:#39253c;--paper:#dfe5d6;--paper2:#d3dbc8;--ink:#20241d;--cream:#faf4e9;--muted:#a99bab;--faint:#6e5d72;--line:rgba(250,244,233,.12);--tomato:#ff7055;--sage:#b9d08f;--yellow:#ebd779;--red:#de675b;--serif:"Instrument Serif",Georgia,serif;--sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"DM Mono",monospace}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--night);color:var(--cream)}body{font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:minmax(410px,45%) minmax(0,1fr);min-height:100dvh}.journal{min-height:100dvh;padding:29px clamp(18px,3vw,44px) 50px;border-right:1px solid var(--line);background:radial-gradient(circle at 8% 0,rgba(255,112,85,.1),transparent 24%),var(--night)}.detail{min-height:100dvh;max-height:100dvh;overflow:auto;position:sticky;top:0;padding:31px clamp(24px,4vw,64px) 60px;background:var(--paper);color:var(--ink)}
    .top{display:flex;justify-content:space-between;align-items:center}.brand{font:400 46px/.9 var(--serif);letter-spacing:-.04em}.brand i{color:var(--tomato);font-style:normal}.live{font:9px var(--mono);text-transform:uppercase;letter-spacing:.11em;color:var(--muted);display:flex;gap:7px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:var(--tomato);box-shadow:0 0 0 4px rgba(255,112,85,.12)}.dot.off{background:var(--faint);box-shadow:none}.promise{font:400 23px/1.16 var(--serif);color:#d2c6d3;max-width:31ch;margin:23px 0 18px}
    .day{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:9px;margin-bottom:14px}.metric{border-top:1px solid var(--line);padding-top:10px}.metric span{display:block;font:8px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}.metric b{font:400 24px var(--serif);display:block;margin-top:3px}.metric.hero b{font-size:33px}.metric small{font-size:9px;color:var(--muted)}.progress{height:4px;border-radius:4px;background:rgba(255,255,255,.07);margin-top:7px;overflow:hidden}.progress i{display:block;height:100%;background:var(--sage);border-radius:4px}.metric.hero .progress i{background:var(--tomato)}
    .composer{border:1px solid rgba(250,244,233,.2);background:var(--night2);border-radius:16px;padding:12px;box-shadow:0 22px 70px rgba(0,0,0,.2)}.formgrid{display:grid;grid-template-columns:1.25fr .52fr .52fr;gap:8px}.field label{display:block;margin:0 0 5px 3px;font:8px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}.field input,.field select{height:40px;width:100%;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.035);padding:0 10px;outline:0}.field input:focus,.field select:focus{border-color:rgba(255,112,85,.55)}.field input::placeholder{color:var(--faint)}.formfoot{display:flex;align-items:center;justify-content:space-between;margin-top:9px}.hint{font-size:10px;color:var(--faint)}.go{border:0;border-radius:999px;height:38px;padding:0 16px;background:var(--tomato);color:#281722;font-size:11px;font-weight:600}.go:disabled{opacity:.5}
    .toolbar{display:flex;align-items:center;gap:7px;margin:20px 0 11px}.filter{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);padding:7px 11px;font-size:10px}.filter.on{background:var(--cream);border-color:var(--cream);color:var(--night)}.count{margin-left:auto;font:9px var(--mono);color:var(--faint)}.count b{color:var(--tomato);font-weight:500}.list{display:grid;gap:6px}.item{width:100%;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:11px;align-items:center;border:1px solid transparent;border-radius:14px;background:transparent;padding:12px;text-align:left}.item:hover{background:rgba(255,255,255,.03);border-color:var(--line)}.item.on{background:var(--night2);border-color:rgba(250,244,233,.2)}.mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font:10px var(--mono);color:var(--muted);position:relative}.item.pending .mark:after,.item.attention .mark:after{content:"";width:7px;height:7px;border-radius:50%;position:absolute;right:0;top:1px;background:var(--yellow);box-shadow:0 0 0 3px var(--night)}.item.attention .mark:after{background:var(--tomato)}.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:7px;align-items:center;margin-top:2px;font-size:10px;color:var(--muted)}.tag{font:8px var(--mono);letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 6px;background:var(--night3);color:#d2bdd5}.kcal{text-align:right;font:400 20px var(--serif)}.kcal small{display:block;font:8px var(--mono);color:var(--faint)}.empty{padding:28px;border:1px dashed rgba(250,244,233,.2);border-radius:15px;text-align:center;color:var(--muted)}.empty strong{display:block;font:400 23px var(--serif);color:var(--cream)}
    .eyebrow{font:8px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:#74806d}.headline{font:400 clamp(38px,5vw,63px)/.95 var(--serif);letter-spacing:-.035em;margin:5px 0}.subline{font:10px var(--mono);color:#74806d}.plate{margin:24px 0 20px;border-radius:19px;padding:22px;background:var(--ink);color:var(--cream);display:grid;grid-template-columns:minmax(0,1fr) minmax(195px,.8fr);gap:20px}.big{font:400 clamp(47px,7vw,78px)/.95 var(--serif);letter-spacing:-.02em}.big small{font:400 22px var(--serif);color:#b6b9ae}.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-left:1px solid rgba(255,255,255,.13);padding-left:20px}.macro{align-self:end}.macro span{display:block;font:8px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:#91978d}.macro b{font:400 25px var(--serif)}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px 24px;margin:21px 0}.fact span{display:block;font:8px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:#7f8a78;margin-bottom:3px}.fact b{font-size:12px;font-weight:500}.review{border-radius:17px;padding:20px;background:var(--paper2);display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px}.review.attn{background:#efb8a7}.score{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper);font:10px var(--mono)}.review h3{font:400 24px/1 var(--serif);margin:0 0 6px}.review p{font-size:12px;color:#586151;margin:0}.next{margin-top:10px;padding-top:10px;border-top:1px solid rgba(32,36,29,.13);font-size:11px}.next b{font-weight:600}
    .section{border-top:1px solid rgba(32,36,29,.15);padding-top:20px;margin-top:23px}.section h3{font:400 23px var(--serif);margin:0 0 14px}.daycard{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}.target{border:1px solid rgba(32,36,29,.14);border-radius:14px;padding:15px}.target-top{display:flex;justify-content:space-between}.target b{font-size:12px}.target small{font:8px var(--mono);color:#74806d;text-transform:uppercase}.target .progress{background:rgba(32,36,29,.09);height:6px}.target .progress i{background:#6f8462}.target p{margin:8px 0 0;color:#66705f;font-size:10px}.signals{display:grid;gap:8px}.signal{border-left:3px solid #91a782;background:rgba(255,255,255,.25);padding:11px 13px}.signal.medium,.signal.high{border-color:var(--tomato)}.signal b{font-size:12px}.signal p{font-size:11px;color:#616a5a;margin:3px 0 0}.blank{height:calc(100dvh - 62px);display:grid;place-items:center;text-align:center;color:#6d7867}.blank .dish{width:78px;height:78px;border-radius:50%;border:1px solid rgba(32,36,29,.22);display:grid;place-items:center;margin:0 auto 17px;font:400 35px var(--serif)}.blank h2{font:400 31px var(--serif);color:var(--ink);margin:0}.toast{position:fixed;z-index:20;left:50%;bottom:22px;transform:translate(-50%,14px);opacity:0;pointer-events:none;transition:.2s;border-radius:999px;background:#171019;color:#fff;padding:10px 15px;font-size:11px}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{background:#8d3528}.center{min-height:100dvh;display:grid;place-items:center;text-align:center}.center h1{font:400 48px var(--serif);margin:0}.center p{color:var(--muted)}
    @media(max-width:900px){.shell{display:block}.journal{min-height:auto;border-right:0}.detail{position:static;max-height:none;min-height:70dvh}.headline{font-size:48px}}@media(max-width:560px){.journal{padding:21px 14px 30px}.detail{padding:24px 17px 48px}.formgrid{grid-template-columns:1fr 1fr}.formgrid .field:first-child{grid-column:1/-1}.day{grid-template-columns:1.35fr 1fr}.day .metric:last-child{display:none}.plate{grid-template-columns:1fr}.macros{border-left:0;border-top:1px solid rgba(255,255,255,.13);padding:14px 0 0}.facts{grid-template-columns:1fr 1fr}.daycard{grid-template-columns:1fr}.brand{font-size:41px}}
  </style>
</head>
<body>
<!-- BEGIN SHARED TELEGRAM ACCESS -->
<script>
(function (global) {
  "use strict";

  var STYLE_ID = "lemma-miniapp-access-style";
  var GATE_ID = "lemma-miniapp-access-gate";
  var BADGE_ID = "lemma-miniapp-telegram-badge";

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (char) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char];
    });
  }

  function injectStyles() {
    if (document.getElementById(STYLE_ID)) return;
    var style = document.createElement("style");
    style.id = STYLE_ID;
    style.textContent =
      ".lma-gate{position:fixed;inset:0;z-index:2147483600;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#f7f8ff 0%,#fff 55%,#fff5ef 100%);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#18213b}" +
      ".lma-card{width:min(100%,430px);padding:28px;border:1px solid #e1e4ef;border-radius:28px;background:rgba(255,255,255,.96);box-shadow:0 26px 80px rgba(38,43,92,.16)}" +
      ".lma-mark{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:#ececff;color:#5658df;font-size:21px;font-weight:800}" +
      ".lma-kicker{margin-top:22px;color:#6265e8;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}" +
      ".lma-card h1{margin:7px 0 0;font-size:29px;line-height:1.08;letter-spacing:-.055em}" +
      ".lma-card p{margin:11px 0 0;color:#69738d;font-size:13px;line-height:1.62}" +
      ".lma-phone{margin-top:19px;padding:13px 14px;border:1px solid #e1e4ef;border-radius:16px;background:#f8f9fc}" +
      ".lma-phone small{display:block;color:#7c859d;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}" +
      ".lma-phone b{display:block;margin-top:3px;font-size:15px;letter-spacing:-.02em}" +
      ".lma-field{display:block;margin-top:18px}.lma-field span{display:block;margin-bottom:7px;color:#69738d;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}" +
      ".lma-field input{width:100%;height:50px;border:1px solid #dfe3ed;border-radius:15px;padding:0 14px;background:#fff;color:#18213b;font:700 15px/1 'Plus Jakarta Sans',sans-serif;outline:none;box-sizing:border-box}.lma-field input:focus{border-color:#696ae8;box-shadow:0 0 0 4px rgba(86,88,223,.1)}" +
      ".lma-action{width:100%;min-height:52px;margin-top:18px;border:0;border-radius:16px;padding:0 18px;background:#5658df;color:#fff;font:800 13px/1 'Plus Jakarta Sans',sans-serif;box-shadow:0 12px 25px rgba(86,88,223,.24);cursor:pointer}" +
      ".lma-action:disabled{opacity:.55;cursor:wait;box-shadow:none}" +
      ".lma-action-secondary{background:#f0f1ff;color:#4547c7;box-shadow:none}" +
      ".lma-code{margin-top:16px;padding:16px;border:1px dashed #bfc4d6;border-radius:16px;background:#fafbff;text-align:center}.lma-code small{display:block;color:#7c859d;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.lma-code b{display:block;margin-top:5px;font-size:19px;letter-spacing:.04em}" +
      ".lma-status{margin-top:12px;color:#69738d;font-size:11px;text-align:center}" +
      ".lma-error{margin-top:13px;padding:10px 12px;border-radius:12px;background:#fff0f1;color:#9f3b47;font-size:11px;line-height:1.45}" +
      ".lma-fine{margin-top:13px!important;font-size:10px!important;line-height:1.5!important;color:#8a92a7!important;text-align:center}" +
      ".lma-badge{position:fixed;right:12px;bottom:var(--lma-bottom,16px);z-index:2147483000;display:flex;align-items:center;gap:9px;min-height:43px;border:1px solid rgba(50,57,91,.12);border-radius:999px;padding:5px 6px 5px 12px;background:rgba(255,255,255,.94);box-shadow:0 10px 28px rgba(35,42,85,.15);backdrop-filter:blur(16px);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}" +
      ".lma-badge-copy{min-width:0}.lma-badge-copy small{display:block;color:#6f7890;font-size:8px;font-weight:750;line-height:1.1}.lma-badge-copy b{display:block;margin-top:2px;color:#202a45;font-size:10px;line-height:1.1}" +
      ".lma-badge button{height:33px;border:0;border-radius:999px;padding:0 12px;background:#2aabee;color:#fff;font:800 10px/1 'Plus Jakarta Sans',sans-serif;cursor:pointer}" +
      "@media(max-width:520px){.lma-card{padding:24px;border-radius:24px}.lma-card h1{font-size:27px}.lma-badge{left:12px;right:12px;justify-content:space-between}.lma-badge button{padding:0 15px}}";
    document.head.appendChild(style);
  }

  function apiBase() {
    var config = global.__LEMMA_CONFIG__ || {};
    return String(config.apiUrl || global.location.origin).replace(/\/$/, "");
  }

  function podId() {
    var config = global.__LEMMA_CONFIG__ || {};
    return config.podId || config.pod_id || null;
  }

  function normalizeBot(value) {
    return String(value || "").trim().replace(/^@/, "");
  }

  function displayPhone(value) {
    var raw = String(value || "").trim();
    if (!raw) return "Not connected";
    var digits = raw.replace(/\D/g, "");
    if (!digits) return raw;
    var suffix = digits.slice(-10);
    if (digits.length === 12 && digits.indexOf("91") === 0) {
      return "+91 " + suffix.slice(0, 5) + " " + suffix.slice(5);
    }
    return raw.charAt(0) === "+" ? raw : "+" + digits;
  }

  function isConflict(error) {
    var status = Number(error && (error.status || error.statusCode || error.code));
    var message = String((error && error.message) || "").toLowerCase();
    return status === 409 || message.indexOf("already a member") >= 0 || message.indexOf("owner has access") >= 0;
  }

  async function ensureMembership(client) {
    var id = podId();
    if (!id || !client.pods || !client.pods.join) return;
    try {
      await client.pods.join(id);
    } catch (error) {
      if (!isConflict(error)) throw error;
    }
  }

  function e164(value) {
    var digits = String(value || "").replace(/\D/g, "");
    if (!digits || digits.length < 8 || digits.length > 15 || digits.charAt(0) === "0") {
      return null;
    }
    return "+" + digits;
  }

  async function verificationConfig(client) {
    try {
      return await client.request("GET", "/auth/mobile-verification/whatsapp/config");
    } catch (error) {
      return { available: false };
    }
  }

  function renderGate(client, profile, options, config) {
    injectStyles();
    var existing = document.getElementById(GATE_ID);
    if (existing) existing.remove();
    var gate = document.createElement("div");
    gate.id = GATE_ID;
    gate.className = "lma-gate";
    var number = profile && profile.mobile_number;
    var hasNumber = Boolean(number);
    var available = config && config.available === true;
    gate.innerHTML =
      '<section class="lma-card" role="dialog" aria-modal="true" aria-label="Verify phone">' +
      '<div class="lma-mark">L</div>' +
      '<div class="lma-kicker">' + esc(options.appName || "Lemma app") + "</div>" +
      "<h1>" + (hasNumber ? "Verify your phone." : "Connect your phone.") + "</h1>" +
      "<p>One verified number keeps your private app data and Telegram messages attached to the same Lemma identity. Lemma verifies it through WhatsApp.</p>" +
      (hasNumber
        ? '<div class="lma-phone"><small>Phone on your Lemma profile</small><b>' + esc(displayPhone(number)) + "</b></div>"
        : '<label class="lma-field"><span>Your mobile number</span><input id="lmaPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+91 98765 43210"></label>') +
      '<div id="lmaError"></div>' +
      '<button id="lmaVerify" class="lma-action" ' + (available ? "" : "disabled") + ">" +
      (available ? "Verify with WhatsApp" : "Phone verification unavailable") +
      "</button>" +
      '<p class="lma-fine">You will send a one-time verification message to Lemma. Your app records remain protected by per-user row security.</p>' +
      "</section>";
    document.body.appendChild(gate);
    var button = gate.querySelector("#lmaVerify");
    if (button && available) {
      button.onclick = async function () {
        var input = gate.querySelector("#lmaPhone");
        var mobile = e164(hasNumber ? number : input && input.value);
        var errorBox = gate.querySelector("#lmaError");
        if (!mobile) {
          errorBox.innerHTML = '<div class="lma-error">Enter a mobile number with its country code, beginning with +.</div>';
          return;
        }
        button.disabled = true;
        button.textContent = "Preparing verification…";
        errorBox.innerHTML = "";
        try {
          var transaction = await client.request(
            "POST",
            "/auth/mobile-verification/whatsapp/start",
            { body: { mobile_number: mobile } }
          );
          renderTransaction(client, profile, options, transaction);
        } catch (error) {
          button.disabled = false;
          button.textContent = "Verify with WhatsApp";
          errorBox.innerHTML =
            '<div class="lma-error">' +
            esc((error && error.message) || "Phone verification could not start.") +
            "</div>";
        }
      };
    }
  }

  function renderTransaction(client, profile, options, transaction) {
    var gate = document.getElementById(GATE_ID);
    if (!gate) return;
    var card = gate.querySelector(".lma-card");
    card.innerHTML =
      '<div class="lma-mark">L</div>' +
      '<div class="lma-kicker">' + esc(options.appName || "Lemma app") + "</div>" +
      "<h1>Send the message.</h1>" +
      "<p>WhatsApp will open with the verification message ready. Send it from the phone number you are connecting.</p>" +
      '<div class="lma-phone"><small>Send to Lemma</small><b>' + esc(transaction.display_number || "") + "</b></div>" +
      '<div class="lma-code"><small>Your one-time code</small><b>' + esc(transaction.code || "") + "</b></div>" +
      '<a class="lma-action" style="display:grid;place-items:center;text-decoration:none;box-sizing:border-box" href="' +
      esc(transaction.whatsapp_url || "#") +
      '" target="_blank" rel="noopener noreferrer">Open WhatsApp</a>' +
      '<div id="lmaStatus" class="lma-status">Waiting for verification…</div>' +
      '<button id="lmaCancel" class="lma-action lma-action-secondary" type="button">Use another number</button>';

    var stopped = false;
    var poll = null;
    var status = card.querySelector("#lmaStatus");
    var finish = function () {
      stopped = true;
      if (poll) global.clearInterval(poll);
      document.removeEventListener("visibilitychange", check);
    };
    var check = async function () {
      if (stopped || document.visibilityState !== "visible") return;
      try {
        var result = await client.request(
          "GET",
          "/auth/mobile-verification/whatsapp/status/" +
            encodeURIComponent(transaction.transaction_id)
        );
        if (result.status === "VERIFIED") {
          finish();
          status.textContent = "Verified. Connecting Telegram…";
          var updated = await client.users.getProfile();
          gate.remove();
          mountBadge(updated, options);
        } else if (result.status === "EXPIRED") {
          finish();
          status.innerHTML = '<span class="lma-error" style="display:block">That code expired. Start again for a fresh one.</span>';
        }
      } catch (error) {
        status.textContent = "Still waiting for verification…";
      }
    };
    card.querySelector("#lmaCancel").onclick = function () {
      finish();
      verificationConfig(client).then(function (config) {
        renderGate(client, profile, options, config);
      });
    };
    poll = global.setInterval(check, 3000);
    document.addEventListener("visibilitychange", check);
    check();
  }

  function mountBadge(profile, options) {
    injectStyles();
    var previous = document.getElementById(BADGE_ID);
    if (previous) previous.remove();
    var bot = normalizeBot(options.bot);
    if (!bot) return;
    var badge = document.createElement("aside");
    badge.id = BADGE_ID;
    badge.className = "lma-badge";
    badge.style.setProperty("--lma-bottom", String(options.bottom || 16) + "px");
    badge.innerHTML =
      '<div class="lma-badge-copy"><small>Telegram connected</small><b>' +
      esc(displayPhone(profile.mobile_number)) +
      '</b></div><button type="button">Open @' +
      esc(bot) +
      "</button>";
    badge.querySelector("button").onclick = function () {
      global.open("https://t.me/" + encodeURIComponent(bot), "_blank", "noopener,noreferrer");
    };
    document.body.appendChild(badge);
  }

  async function ensure(client, options) {
    options = options || {};
    await ensureMembership(client);
    var profile = await client.users.getProfile();
    if (!profile.mobile_number) {
      renderGate(client, profile, options, await verificationConfig(client));
      return null;
    }
    var gate = document.getElementById(GATE_ID);
    if (gate) gate.remove();
    mountBadge(profile, options);
    return profile;
  }

  global.LemmaMiniAppAccess = {
    ensure: ensure,
    mountBadge: mountBadge,
    displayPhone: displayPhone,
  };
})(window);
</script>
<!-- END SHARED TELEGRAM ACCESS -->
  <div id="app"><div class="center"><div><h1>Meal<span style="color:var(--tomato)">.</span></h1><p>Opening today’s journal…</p></div></div></div>
  <div id="toast" class="toast"></div>
  <script>
    (function(){var c=window.__LEMMA_CONFIG__||{},b=(c.apiUrl||location.origin).replace(/\/$/,""),s=document.createElement("script");s.src=b+"/public/sdk/lemma-client.js";s.onload=boot;s.onerror=function(){fatal("Could not load the Lemma SDK.");};document.head.appendChild(s);})();
    var client=null,ST={meals:[],days:[],signals:[],selected:null,filter:"today",loading:true,live:false},mw=null,dw=null,sw=null,tt=null;
    function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
    function flat(r){return r&&r.data?Object.assign({id:r.id,created_at:r.created_at,updated_at:r.updated_at},r.data):r||{};}
    function list(r){return(r&&(r.items||r.data))||(Array.isArray(r)?r:[]);}
    function cap(v){return String(v||"").replace(/_/g," ").replace(/\b\w/g,function(c){return c.toUpperCase();});}
    function pct(v){return Math.max(0,Math.min(100,Number(v||0)));}
    function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
    function dateKey(v){if(!v)return"";var d=new Date(v);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
    function when(v){return v?new Date(v).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"—";}
    function ago(v){if(!v)return"—";var m=Math.floor((Date.now()-new Date(v).getTime())/60000);if(m<1)return"now";if(m<60)return m+"m";var h=Math.floor(m/60);if(h<24)return h+"h";return Math.floor(h/24)+"d";}
    function initials(v){return String(v||"?").split(/\s+/).slice(0,2).map(function(x){return x[0]||"";}).join("").toUpperCase();}
    function num(v,n){return Number(v||0).toFixed(n==null?0:n);}
    function toast(m,e){var t=document.getElementById("toast");t.textContent=m;t.className="toast"+(e?" err":"")+" show";clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show");},2200);}
    function fatal(m){document.getElementById("app").innerHTML='<div class="center"><div><h1>Meal.</h1><p>'+esc(m)+'</p><button class="go" onclick="location.reload()">Try again</button></div></div>';}
    async function boot(){try{client=new window.LemmaClient.LemmaClient();var a=await client.initialize();if(a.status!=="authenticated")return signIn();var p=await window.LemmaMiniAppAccess.ensure(client,{appName:"Meal",bot:"lemma_meal_bot",bottom:18});if(!p)return;await loadAll();watch();}catch(e){fatal(e&&e.message||"Could not open Meal.");}}
    function signIn(){document.getElementById("app").innerHTML='<div class="center"><div><h1>Meal.</h1><p>Sign in to open your food journal.</p><button id="sign" class="go">Sign in</button></div></div>';document.getElementById("sign").onclick=function(){client.auth.redirectToAuth();};}
    async function loadAll(){ST.loading=true;render();try{var r=await Promise.all([client.records.list("meals",{limit:400,sort:[{field:"logged_at",direction:"desc"}]}),client.records.list("daily_nutrition",{limit:90,sort:[{field:"log_date",direction:"desc"}]}),client.records.list("meal_signals",{limit:200,sort:[{field:"created_at",direction:"desc"}]})]);ST.meals=list(r[0]).map(flat);ST.days=list(r[1]).map(flat);ST.signals=list(r[2]).map(flat);sort();if(!ST.selected&&ST.meals[0])ST.selected=ST.meals[0].id;}finally{ST.loading=false;render();}}
    function sort(){ST.meals.sort(function(a,b){return String(b.logged_at||"").localeCompare(String(a.logged_at||""));});}
    function merge(a,c,kind){var id=c.record_id,p=flat(c.payload||{}),i=a.findIndex(function(x){return x.id===id;});if(c.operation==="delete"){if(i>=0)a.splice(i,1);return;}var r=Object.assign({},i>=0?a[i]:{},p,{id:id});if(i>=0)a[i]=r;else a.unshift(r);if(kind==="meal")sort();}
    function watch(){try{mw=client.datastore.watchChanges({table:"meals",onChange:function(c){merge(ST.meals,c,"meal");if(!ST.selected&&ST.meals[0])ST.selected=ST.meals[0].id;render();},onStatus:function(s){ST.live=s==="open";live();}});dw=client.datastore.watchChanges({table:"daily_nutrition",onChange:function(c){merge(ST.days,c);render();}});sw=client.datastore.watchChanges({table:"meal_signals",onChange:function(c){merge(ST.signals,c);detail();}});}catch(e){ST.live=false;live();}}
    function live(){var d=document.getElementById("ld"),t=document.getElementById("lt");if(d)d.classList.toggle("off",!ST.live);if(t)t.textContent=ST.live?"live":"connecting";}
    function current(){return ST.meals.find(function(x){return x.id===ST.selected;})||null;}
    function day(){return ST.days.find(function(x){return x.log_date===today();})||{meal_count:0,reviewed_count:0,calories:0,protein_g:0,carbs_g:0,fat_g:0,calorie_target:2000,protein_target_g:100,calorie_progress_percent:0,protein_progress_percent:0,attention_count:0};}
    function visible(){return ST.meals.filter(function(x){if(ST.filter==="today")return dateKey(x.logged_at)===today();if(ST.filter==="pending")return x.review_status==="pending";if(ST.filter==="attention")return !!x.needs_attention;return true;});}
    function render(){var d=day(),rows=visible(),pending=ST.meals.filter(function(x){return x.review_status==="pending"&&dateKey(x.logged_at)===today();}).length;var h='<div class="shell"><section class="journal"><div class="top"><div class="brand">Meal<i>.</i></div><div class="live"><span id="ld" class="dot'+(ST.live?"":" off")+'"></span><span id="lt">'+(ST.live?"live":"connecting")+'</span></div></div><p class="promise">Remember the day. Leave the judgment out.</p>'+
      '<div class="day"><div class="metric hero"><span>Today</span><b>'+num(d.calories)+' kcal</b><small>'+d.meal_count+' meals</small><div class="progress"><i style="width:'+pct(d.calorie_progress_percent)+'%"></i></div></div><div class="metric"><span>Protein</span><b>'+num(d.protein_g)+' g</b><small>of '+num(d.protein_target_g)+' g</small><div class="progress"><i style="width:'+pct(d.protein_progress_percent)+'%"></i></div></div><div class="metric"><span>Review</span><b>'+d.reviewed_count+'/'+d.meal_count+'</b><small>quietly filed</small></div></div>'+
      '<form id="form" class="composer"><div class="formgrid"><div class="field"><label>What did you eat?</label><input id="name" placeholder="Paneer grain bowl" required></div><div class="field"><label>Calories</label><input id="calories" type="number" min="0" placeholder="620"></div><div class="field"><label>Protein g</label><input id="protein" type="number" min="0" placeholder="31"></div></div><div class="formfoot"><span class="hint">Or message @lemma_meal_bot with words or a photo.</span><button id="add" class="go">Log meal</button></div></form>'+
      '<div class="toolbar">'+["today","pending","attention","all"].map(function(f){return'<button class="filter '+(ST.filter===f?"on":"")+'" data-filter="'+f+'">'+cap(f)+'</button>';}).join("")+'<span class="count"><b>'+pending+'</b> reviewing · <b>'+d.attention_count+'</b> attention</span></div><div class="list">';
      if(ST.loading)h+='<div class="empty">Opening today’s journal…</div>';else if(!rows.length)h+='<div class="empty"><strong>No meals here yet.</strong>Tell Meal what you ate.</div>';else rows.forEach(function(x){h+=row(x);});h+='</div></section><aside id="detail" class="detail"></aside></div>';document.getElementById("app").innerHTML=h;bind();detail();}
    function row(x){var st=x.needs_attention?"attention":x.review_status==="pending"?"pending":"reviewed";return'<button class="item '+st+' '+(ST.selected===x.id?"on":"")+'" data-id="'+esc(x.id)+'"><span class="mark">'+esc(initials(x.name))+'</span><span><span class="name">'+esc(x.name)+'</span><span class="meta"><span class="tag">'+esc(cap(x.meal_type))+'</span><span>'+esc(x.notes||x.protein_g+" g protein")+'</span></span></span><span class="kcal">'+num(x.calories)+'<small>kcal · '+esc(ago(x.logged_at))+'</small></span></button>';}
    function bind(){var f=document.getElementById("form");if(f)f.onsubmit=create;document.querySelectorAll(".filter").forEach(function(b){b.onclick=function(){ST.filter=b.getAttribute("data-filter");render();};});document.querySelectorAll(".item").forEach(function(b){b.onclick=function(){ST.selected=b.getAttribute("data-id");render();if(innerWidth<901)document.getElementById("detail").scrollIntoView({behavior:"smooth"});};});}
    function detail(){var r=document.getElementById("detail");if(!r)return;var x=current();if(!x){r.innerHTML='<div class="blank"><div><div class="dish">◌</div><h2>A food journal, not a verdict.</h2><p>Select a meal to inspect its gentle review.</p></div></div>';return;}var d=day(),sigs=ST.signals.filter(function(s){return s.meal_id===x.id&&s.status==="open";}),reviewTitle=x.review_status==="pending"?"Reviewing this meal":x.needs_attention?"Estimate needs a look":"A useful piece of the day",reviewText=x.review_note||(x.review_status==="pending"?"The background reviewer is reading the meal in context.":"No review note yet.");r.innerHTML='<div class="eyebrow">'+esc(cap(x.meal_type))+'</div><h1 class="headline">'+esc(x.name)+'</h1><div class="subline">'+esc(when(x.logged_at))+' · '+esc(cap(x.source))+'</div>'+
      '<div class="plate"><div><div class="eyebrow" style="color:#91978d">Energy estimate</div><div class="big">'+num(x.calories)+' <small>kcal</small></div></div><div class="macros"><div class="macro"><span>Protein</span><b>'+num(x.protein_g)+'g</b></div><div class="macro"><span>Carbs</span><b>'+num(x.carbs_g)+'g</b></div><div class="macro"><span>Fat</span><b>'+num(x.fat_g)+'g</b></div></div></div>'+
      '<div class="facts"><div class="fact"><span>Balance</span><b>'+(x.meal_score?x.meal_score+' / 5':"Assessing")+'</b></div><div class="fact"><span>Protein</span><b>'+esc(cap(x.protein_signal||"assessing"))+'</b></div><div class="fact"><span>Plants</span><b>'+esc(cap(x.plant_signal||"assessing"))+'</b></div><div class="fact"><span>Portion</span><b>'+esc(x.quantity?(x.quantity+" "+(x.unit||"serving")):"Not specified")+'</b></div><div class="fact"><span>Review</span><b>'+esc(cap(x.review_status))+'</b></div><div class="fact"><span>Attention</span><b>'+(x.needs_attention?"Yes":"No")+'</b></div></div>'+
      '<div class="review '+(x.needs_attention?"attn":"")+'"><span class="score">'+(x.meal_score||"…")+'</span><div><h3>'+esc(reviewTitle)+'</h3><p>'+esc(reviewText)+'</p><div class="next"><b>Next move:</b> '+esc(x.next_move||"A gentle suggestion will appear after review.")+'</div></div></div>'+
      '<section class="section"><h3>Today in context</h3><div class="daycard"><div class="target"><div class="target-top"><b>Calories</b><small>'+num(d.calorie_progress_percent)+'%</small></div><div class="progress"><i style="width:'+pct(d.calorie_progress_percent)+'%"></i></div><p>'+num(d.calories)+' of '+num(d.calorie_target)+' kcal logged</p></div><div class="target"><div class="target-top"><b>Protein</b><small>'+num(d.protein_progress_percent)+'%</small></div><div class="progress"><i style="width:'+pct(d.protein_progress_percent)+'%"></i></div><p>'+num(d.protein_g)+' of '+num(d.protein_target_g)+' g logged</p></div></div></section>'+
      '<section class="section"><h3>Signals</h3><div class="signals">'+(sigs.length?sigs.map(signal).join(""):'<div style="font-size:11px;color:#6d7867">No open signal for this meal.</div>')+'</div></section>';
    }
    function signal(s){return'<div class="signal '+esc(s.severity)+'"><b>'+esc(s.title)+'</b><p>'+esc(s.body)+'</p></div>';}
    async function create(e){e.preventDefault();var n=document.getElementById("name"),c=document.getElementById("calories"),p=document.getElementById("protein"),b=document.getElementById("add");b.disabled=true;b.textContent="Logging…";try{var r=await client.functions.run("log_meal",{name:n.value.trim(),meal_type:guessType(),calories:Number(c.value||0),protein_g:Number(p.value||0),carbs_g:0,fat_g:0,source:"manual",notes:"Quick entry from Meal app",raw_input:{text:n.value.trim()}});var o=r.output_data||r.output||r;ST.selected=o.meal_id;n.value="";c.value="";p.value="";toast("Meal logged. Gentle review queued.");await loadAll();}catch(err){toast(err&&err.message||"Could not log meal.",true);}finally{b.disabled=false;b.textContent="Log meal";}}
    function guessType(){var h=new Date().getHours();return h<11?"breakfast":h<15?"lunch":h<21?"dinner":"snack";}
  </script>
